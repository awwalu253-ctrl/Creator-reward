{% extends "base.html" %}

{% block title %}Error - {{ company_name }}{% endblock %}

{% block content %}
<style>
    .error-section {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        background: linear-gradient(135deg, #f8fafc 0%, #ffffff 50%, #f8fafc 100%);
    }
    .error-wrapper {
        text-align: center;
        max-width: 500px;
    }
    .error-icon {
        font-size: 4rem;
        color: #dc2626;
        margin-bottom: 20px;
    }
    .error-wrapper h1 {
        font-size: 2rem;
        font-weight: 800;
        color: #1a1a2e;
        margin-bottom: 16px;
    }
    .error-wrapper p {
        color: #6b7280;
        margin-bottom: 30px;
        line-height: 1.8;
    }
    .error-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }
    @media (max-width: 480px) {
        .error-actions {
            flex-direction: column;
            align-items: center;
        }
        .error-actions .btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<div class="error-section">
    <div class="container">
        <div class="error-wrapper">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1>Something Went Wrong</h1>
            <p>
                {{ error_message if error_message else "We're sorry, but something went wrong. Please try again later." }}
            </p>
            <div class="error-actions">
                <a href="{{ url_for('landing') }}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Return Home
                </a>
                <a href="mailto:{{ company_email }}" class="btn btn-secondary">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
