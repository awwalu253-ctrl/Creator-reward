{% extends "base.html" %}

{% block title %}Admin Login - {{ company_name }}{% endblock %}

{% block content %}
<div class="admin-login-section">
    <div class="container">
        <div class="admin-login-wrapper">
            <div class="admin-login-header">
                <i class="fas fa-shield-alt" style="font-size: 48px; color: #667eea;"></i>
                <h1>Admin Login</h1>
                <p>Enter your password to access the admin dashboard</p>
            </div>
            
            <form method="POST" action="{{ url_for('admin_login') }}" class="admin-login-form">
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Admin Password
                    </label>
                    <input type="password" id="password" name="password" 
                           placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="admin-login-footer">
                <a href="{{ url_for('landing') }}"><i class="fas fa-home"></i> Back to Home</a>
            </div>
        </div>
    </div>
</div>

<style>
    .admin-login-section {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7fafc;
        padding: 40px 20px;
    }
    .admin-login-wrapper {
        max-width: 400px;
        width: 100%;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .admin-login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .admin-login-header h1 {
        margin: 10px 0 5px;
        font-size: 24px;
    }
    .admin-login-header p {
        color: #718096;
        font-size: 14px;
    }
    .admin-login-form .form-group {
        margin-bottom: 20px;
    }
    .admin-login-form label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
    }
    .admin-login-form input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
    }
    .admin-login-form input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
    }
    .admin-login-form .btn {
        width: 100%;
        justify-content: center;
    }
    .admin-login-footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
    }
    .admin-login-footer a {
        color: #667eea;
        text-decoration: none;
    }
</style>
{% endblock %}
