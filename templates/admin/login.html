{% extends "base.html" %}

{% block title %}Admin Login - {{ company_name }}{% endblock %}

{% block content %}
<style>
    .login-section {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: #f7fafc;
    }
    .login-wrapper {
        max-width: 400px;
        width: 100%;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header h1 {
        font-size: 24px;
        font-weight: 800;
        color: #1a1a2e;
        margin: 10px 0 5px;
    }
    .login-header p {
        color: #718096;
        font-size: 14px;
    }
    .login-header .icon {
        font-size: 48px;
        color: #dc2626;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: #4a5568;
        margin-bottom: 8px;
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #dc2626;
        box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
    }
    .btn-login:hover {
        background: #b91c1c;
    }
    .login-footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
    }
    .login-footer a {
        color: #dc2626;
        text-decoration: none;
    }
</style>

<div class="login-section">
    <div class="login-wrapper">
        <div class="login-header">
            <div class="icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin Login</h1>
            <p>Enter your password to access the dashboard</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Admin Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        <div class="login-footer">
            <a href="{{ url_for('landing') }}"><i class="fas fa-home"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
